# dev.bagdar.academy с HTTPS (ветка develop; сертификат Let's Encrypt, продлевается certbot.timer)
server {
    listen 80;
    listen [::]:80;
    server_name dev.bagdar.academy;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://dev.bagdar.academy$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.bagdar.academy;

    ssl_certificate /etc/letsencrypt/live/dev.bagdar.academy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.bagdar.academy/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Dev-версию не индексируют поисковики
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }

    include snippets/bagdar-dev-locations.conf;
}
