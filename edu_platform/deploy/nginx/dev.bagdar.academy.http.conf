# dev.bagdar.academy без HTTPS — до выпуска сертификата (setup.sh dev ssl заменит на dev.bagdar.academy.https.conf)
server {
    listen 80;
    listen [::]:80;
    server_name dev.bagdar.academy;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Dev-версию не индексируют поисковики
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }

    include snippets/bagdar-dev-locations.conf;
}
